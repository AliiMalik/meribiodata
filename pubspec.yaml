name: meribiodata
description: "Offline-first, privacy-first Islamic marriage biodata generator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter

  # Holds the Hive box encryption key only (NFR-6).
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  # Local storage. See docs/decisions.md D2 — Hive CE, storing JSON documents so
  # no Hive type ever leaks past the repository boundary.
  google_mobile_ads: ^9.0.0
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  image_picker: ^1.2.3
  in_app_purchase: ^3.3.0
  intl: any
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  # State management is fixed by the SRS: Provider + ChangeNotifier +
  # repositories.
  pdf: ^3.13.0
  printing: ^5.15.0
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  # On-device tests. The MediaStore save and the Perso-Arabic shaping are both
  # native paths that a host-side test cannot reach — see integration_test/.
  integration_test:
    sdk: flutter
  # Pinned: 3.2.6-dev.1 is a prerelease and 3.2.5 is the newest stable that
  # resolves against this analyzer version.
  freezed: 3.2.5
  json_serializable: ^6.14.1
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/i18n/
    - assets/data/
    # Border artwork for the decorated templates (D20).
    - assets/templates/

  fonts:
    # UI chrome (Latin). SIL OFL.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    # Document fonts. Registered here so the same families are available to the
    # on-screen preview and to the Pipeline B capture (docs/decisions.md D1).
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700

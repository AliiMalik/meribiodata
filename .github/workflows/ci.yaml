name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate models
        run: dart run build_runner build

      - name: Fail on untranslated messages
        run: |
          if [ -s l10n-untranslated.json ] && [ "$(cat l10n-untranslated.json)" != "{}" ]; then
            echo "::error::Untranslated messages remain:"
            cat l10n-untranslated.json
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      # Goldens are excluded because they are platform-specific bitmaps; see
      # dart_test.yaml for why, and for how to make CI authoritative instead.
      - name: Test
        run: flutter test --exclude-tags golden

  privacy-guard:
    name: NFR-1 — no network clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NFR-1, as amended by D15. Three things may reach the network:
      #   * the AdMob SDK (google_mobile_ads),
      #   * url_launcher opening the privacy policy in the user's browser,
      #   * Google Play Billing, which is platform channels rather than HTTP,
      #   * Google Drive sync, writing an encrypted blob to the *user's own*
      #     Drive.
      #
      # What still holds absolutely: no developer-owned backend, and nothing
      # readable leaves the device. Drive receives ciphertext it cannot open.
      - name: Reject unsanctioned HTTP clients
        run: |
          if grep -nE '^[[:space:]]*(dio|chopper|retrofit|graphql_flutter|web_socket_channel):' pubspec.yaml; then
            echo "::error::An HTTP client was added to pubspec.yaml. See NFR-1 and docs/decisions.md D15 before allowing this."
            exit 1
          fi

      # `http` is permitted, but only where Drive sync lives. Anywhere else it
      # is the beginning of a backend.
      - name: Confine network calls to the sync layer
        run: |
          if grep -rlE "import 'package:(http|dio|chopper)/" lib/ | grep -v '^lib/features/sync/'; then
            echo "::error::Network code outside lib/features/sync/. Only Drive sync, the ads SDK and the browser hand-off may touch the network."
            exit 1
          fi
          if grep -rnE "import 'dart:io'.*HttpClient|HttpClient\(" lib/; then
            echo "::error::Application code is opening its own HttpClient."
            exit 1
          fi

      # Drive must only ever receive the encrypted container. If the sync layer
      # could reach the database directly it could upload plaintext, so the
      # dependency runs one way: sync -> BackupService -> store.
      - name: Drive transport must not touch the database
        run: |
          if grep -n "LocalStore\|Collections\." lib/features/sync/drive_client.dart lib/features/sync/drive_auth.dart; then
            echo "::error::The Drive transport reached for storage. It must only ever move opaque bytes."
            exit 1
          fi

      # D8, kept by D17: anything the app links out to opens in the user's own
      # *browser*. Embedding a page would put a third party inside the app and
      # turn "we link you somewhere" into real data sharing. webview_flutter
      # arrives transitively via the AdMob SDK, so this checks for our own use
      # of it rather than for its presence in the lockfile.
      - name: Reject in-app webviews
        run: |
          if grep -rn "package:webview_flutter" lib/; then
            echo "::error::Application code is embedding a webview. External links open in the user's browser by design (docs/decisions.md D8)."
            exit 1
          fi

      # §8: real ad unit IDs are supplied at build time and never committed.
      - name: Reject committed AdMob production IDs
        run: |
          if grep -rnE 'ca-app-pub-[0-9]+' lib/ android/ --include='*.dart' --include='*.xml' --include='*.kts' \
               | grep -v 'ca-app-pub-3940256099942544'; then
            echo "::error::A non-test AdMob ID is committed. Real IDs come from --dart-define / -PadmobAppId at build time (section 8)."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [analyze-and-test, privacy-guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      # Catches Android configuration breakage (minSdk 26, manifest, package id)
      # that the analyzer and unit tests cannot see.
      - name: Build debug APK
        run: flutter build apk --debug

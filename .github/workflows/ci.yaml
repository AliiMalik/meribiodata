name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Fail on untranslated messages
        run: |
          if [ -s l10n-untranslated.json ] && [ "$(cat l10n-untranslated.json)" != "{}" ]; then
            echo "::error::Untranslated messages remain:"
            cat l10n-untranslated.json
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Test
        run: flutter test

  privacy-guard:
    name: NFR-1 — no network clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NFR-1: biodata content must never be transmitted to a developer-owned
      # server. The only permitted network callers are the AdMob SDK and the
      # waitlist submission, neither of which is an HTTP client we write.
      # Adding one is a deliberate architectural decision, so it fails CI and
      # has to be justified in review.
      - name: Reject HTTP client dependencies
        run: |
          if grep -nE '^\s*(http|dio|chopper|retrofit|graphql_flutter|web_socket_channel):' pubspec.yaml; then
            echo "::error::An HTTP client was added to pubspec.yaml. See NFR-1 in the build prompt and docs/decisions.md before allowing this."
            exit 1
          fi

      - name: Reject HTTP usage in application code
        run: |
          if grep -rnE "import 'package:(http|dio|chopper)/|import 'dart:io'.*HttpClient|HttpClient\(" lib/; then
            echo "::error::Application code is making its own network calls. Nothing may leave the device except the AdMob SDK and the waitlist submission."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: [analyze-and-test, privacy-guard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Catches Android configuration breakage (minSdk 26, manifest, package id)
      # that the analyzer and unit tests cannot see.
      - name: Build debug APK
        run: flutter build apk --debug

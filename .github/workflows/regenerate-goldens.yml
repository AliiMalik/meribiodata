name: Regenerate goldens

# Run this once to make CI the authority on golden files instead of the
# developer's Windows machine.
#
# Golden files are bitmaps and text rasterizes differently on every platform, so
# a set generated on Windows can never pass on Linux. Today CI skips them
# (see dart_test.yaml) and they are enforced locally — which is weaker than the
# M3 rule that says script regressions must be caught by CI rather than by eye.
#
# To fix that properly:
#   1. Run this workflow from the Actions tab. It regenerates every golden on
#      Linux and commits the result.
#   2. Delete `--exclude-tags golden` from ci.yaml so CI compares them again.
#   3. Developers then run `flutter test --exclude-tags golden` locally, and
#      re-run this workflow whenever a golden legitimately changes.
#
# Deliberately manual. A job that rewrites goldens on every push would turn a
# rendering regression into a silently accepted new baseline, which is the exact
# failure these files exist to prevent.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      - run: flutter pub get

      - name: Regenerate on Linux
        run: flutter test --tags golden --update-goldens

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- test/render/goldens; then
            echo "Goldens already match this platform; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/render/goldens
          git commit -m "test: regenerate goldens on Linux

          Generated by the Regenerate goldens workflow so CI, rather than one
          developer's machine, is the reference platform for these bitmaps."
          git push

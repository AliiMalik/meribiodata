name: Publish privacy policy

# Publishes docs/privacy/ to GitHub Pages, and nothing else.
#
# The path matters. Pointing Pages at the whole `docs/` folder — the other way
# to do this — would also publish decisions.md, the milestone reports and the
# brand assets. Those are engineering notes, not a public site, and a legal page
# is a poor reason to put them online.
#
# Note: GitHub Pages on a *private* repository needs a paid plan. If this repo
# stays private, publish the policy from a separate small public repo instead —
# copy docs/privacy/ into it and enable Pages there. The page is self-contained
# with no build step, so it works either way.

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/privacy/**'
      - '.github/workflows/publish-privacy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, because a half-published
# policy is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page is not still a draft
        run: |
          if grep -q "Effective TBD" docs/privacy/index.html; then
            echo "::error::The effective date is still TBD. Set it before publishing."
            exit 1
          fi
          if grep -q "privacy@safarnamastudios.com" docs/privacy/index.html; then
            echo "::error::The contact address is still the placeholder."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/privacy

      - id: deploy
        uses: actions/deploy-pages@v4
